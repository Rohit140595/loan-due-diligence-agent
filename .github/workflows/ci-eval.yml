# Smoke-test subset of the agent eval suite (tests/test_agent.py).
# Every test here makes real, billed Anthropic API calls (see
# README/Module 5 cost analysis), so this deliberately runs only the 2
# cheapest behavioral-correctness tests (tool-call-count checks, no
# LLM-as-judge grounding calls and no 7-applicant decision-quality
# parametrize) -- a fast, cheap signal that the agent's basic stop/
# continue behavior isn't broken, not a full regression suite. Run the
# full suite locally (`python -m pytest tests/test_agent.py -v`) before
# merging anything that could affect behavior more subtly.
#
# Also deliberately scoped to push events on main only, NOT every
# push/PR -- running this on every WIP commit would mean uncontrolled
# API spend on every push. Gating it to main means it only runs when
# code has already been reviewed and merged, the same point
# ci-fast.yml's cheap checks have already passed.
#
# Requires repo secret ANTHROPIC_API_KEY to be set
# (Settings -> Secrets and variables -> Actions).

name: CI (agent eval smoke test)

on:
  push:
    branches: [main]

jobs:
  eval-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build local databases from fixtures
        run: |
          python scripts/migrate_to_sqlite.py
          python scripts/migrate_news_to_chroma.py

      - name: Start data API in background
        run: |
          uvicorn api:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -sf http://localhost:8000/applicants/APPLICANT-001/profile

      - name: Run behavioral smoke tests (2 cheapest tests only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # `python -m pytest`, not bare `pytest` -- the -m form prepends
        # the current directory to sys.path, which is how
        # tests/test_agent.py's `from agent import ...` resolves the
        # root-level agent.py. Bare `pytest` doesn't do this, and fails
        # with ModuleNotFoundError: No module named 'agent'.
        run: |
          python -m pytest tests/test_agent.py \
            -k "test_clean_applicant_stops_with_minimal_investigation or test_risky_applicant_investigates_thoroughly" \
            -v
